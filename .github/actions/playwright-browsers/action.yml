name: Playwright browsers
description: >-
  Restore the Playwright browsers from the Actions cache, or download them on a
  miss. Keyed on the installed Playwright version and the runner's Ubuntu
  release, so a bump of either refreshes them.
runs:
  using: composite
  steps:
    - name: Playwright version and runner image
      id: playwright
      shell: bash
      run: |
        echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "os=${ImageOS}" >> "$GITHUB_OUTPUT"
    # Playwright downloads a build of each browser for the runner's Ubuntu
    # release, linked against its libraries. The release is in the key, so a
    # new image does not restore the builds of the one before.
    - name: Cache browsers
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.playwright.outputs.os }}-${{ steps.playwright.outputs.version }}
    - name: Download browsers and system deps
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium firefox webkit
    # The runner image is fresh each run, so the shared libraries still need
    # installing even when the browser binaries came from the cache.
    - name: Install system deps only
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium firefox webkit
