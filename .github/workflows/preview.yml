name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    # Forks cannot push to gh-pages, and dependabot has no write token.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - name: Build playground
        if: github.event.action != 'closed'
        # Previews ship without the 50 MB corpus: every preview is committed
        # to the gh-pages branch, and its history would keep each copy.
        env:
          VITE_LOCAL_STREAMS: off
        run: pnpm run playground:build --base=/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          source-dir: playground/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
