name: E2E

# Real-time playback in three browsers: decode-bound, slow, and sensitive to
# runner load, so it runs nightly, on demand from the Actions tab, and on a
# pull request when it gets the `e2e` label. `pnpm run test:e2e` runs it
# locally: it generates the corpus, builds the shipped modules, and runs the
# suite in Vitest browser mode.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    types: [labeled]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        uses: ./.github/actions/playwright-browsers
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Playback E2E (tier 4)
        run: pnpm run test:e2e
      # Public test streams on third-party servers: reported in the job
      # summary and as an artifact, never a failure of the job.
      - name: Conformance streams
        if: always()
        run: |
          for browser in chromium firefox webkit; do
            pnpm exec vitest run -c vitest.e2e.config.ts --project="e2e:$browser" \
              test/e2e/conformance.test.ts --reporter=default --reporter=json \
              --outputFile.json="test/e2e/results/conformance-$browser.json" || true
          done
          node scripts/conformance-table.mjs test/e2e/results/conformance-*.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: test/e2e/results/
