name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Mint the release bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.bot-token.outputs.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Update npm (trusted publishing needs npm 11.5.1 or later)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        uses: ./.github/actions/playwright-browsers

      - name: Verify the gates one last time
        run: pnpm run verify

      # semantic-release and its plugins are dev dependencies, so the
      # release runs the exact versions in pnpm-lock.yaml, installed above
      # with --frozen-lockfile, rather than whatever the registry serves
      # at run time.
      - name: Semantic Release (version commit + tag + Release + npm via OIDC)
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: pnpm exec semantic-release
