name: GitHub Page

on:
  push:
    branches:
      - main

concurrency:
  group: github-page
  cancel-in-progress: false

jobs:
  github-page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Generate stream corpus
        run: test/e2e/gen-streams.sh
      - name: Build playground
        run: pnpm run playground:build --base=/
      - name: Add stream corpus and chapter files to the site
        run: |
          cp -R test/fixtures/streams playground/dist/streams
          cp -R test/fixtures/chapters playground/dist/chapters
      # GitHub Pages reads the custom domain from this file on the published branch.
      - name: Name the domain
        run: echo engine.mattebox.ch > playground/dist/CNAME
      - name: Deploy GitHub Page 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # releases/v4
        with:
          branch: gh-pages
          folder: playground/dist
          force: false
          clean-exclude: pr-preview/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
