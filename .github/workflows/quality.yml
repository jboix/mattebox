name: Quality

on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Every step is a package script, the same ones `pnpm run verify` chains,
      # so the hook and CI cannot drift apart.
      - name: Lint and format
        run: pnpm run lint
      - name: Docs format and links
        run: pnpm run docs:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Architecture rules
        run: pnpm run depcruise
      - name: Dead code
        run: pnpm run knip
      - name: Kernel purity
        run: pnpm run check:purity
      - name: Unit tests (tiers 1 & 2, with coverage)
        run: pnpm run test:node --coverage
      - name: Report Coverage
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser tests (tier 3)
        run: pnpm run test:browser
      - name: Build
        run: pnpm run build
      - name: Emit check
        run: pnpm run check:emit
      - name: Side-effect audit
        run: pnpm run check:side-effects
      - name: Size budgets
        run: pnpm exec size-limit
      - name: Package validation
        run: pnpm run check:package

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Lint commit messages (Conventional Commits drive releases)
        run: |
          pnpm exec commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" --verbose

  size-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Post size-limit deltas as PR comment
        uses: andresz1/size-limit-action@e7493a72a44b113341c0cf6186ab49c17c4b65c1 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          build_script: build
