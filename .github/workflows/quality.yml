name: Quality

on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm biome ci .
      - name: Typecheck
        run: pnpm tsc --noEmit
      - name: Architecture rules
        run: pnpm run depcruise
      - name: Dead code
        run: pnpm knip
      - name: Unit tests (tiers 1 & 2)
        run: pnpm vitest run --project=node
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser tests (tier 3)
        run: pnpm vitest run --project=browser
      - name: Build
        run: pnpm build
      - name: Emit check
        run: ./scripts/check-emit.sh
      - name: Side-effect audit
        run: ./scripts/side-effect-audit.sh
      - name: Size budgets
        run: pnpm size-limit
      - name: Package validation
        run: pnpm publint && pnpm attw --pack .

  size-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Post size-limit deltas as PR comment
        uses: andresz1/size-limit-action@e7493a72a44b113341c0cf6186ab49c17c4b65c1 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          build_script: build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Playback E2E (tier 4)
        run: pnpm exec playwright test
